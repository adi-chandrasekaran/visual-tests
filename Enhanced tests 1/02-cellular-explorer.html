      componentDidCatch(error){document.getElementById('status').textContent='Unable to render the explorer: '+error.message;}
      render(){return this.state.error?h('p',{style:{padding:24}},'The 3D preview could not start. Check WebGL and internet access.'):this.props.children;}
    }
    createRoot(document.getElementById('app')).render(h(ErrorBoundary,null,h(App)));
  </script>
</body>
